<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatxulla & Zeboxon — To'yga Taklifnoma</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0b0f;
            --container-bg: #16161a;
            --text-color: #ffffff;
            --text-secondary: #9898a6;
            --accent-color: #d4af37;
            --card-bg: #202026;
            --border-color: rgba(212, 175, 55, 0.2);
            --btn-hover: #e6c547;
        }

        body.girl-theme {
            --bg-color: #fff0f5;
            --container-bg: #ffffff;
            --text-color: #4a3b4c;
            --text-secondary: #8c7a8e;
            --accent-color: #ff69b4;
            --card-bg: #fff5fa;
            --border-color: rgba(255, 105, 180, 0.3);
            --btn-hover: #ff479e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 15px 30px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Yuqori Tomchisimon Switcher Paneli */
        .switcher-wrapper {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 5px;
            border-radius: 35px;
            display: flex;
            gap: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 360px;
        }

        .switch-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .switch-btn.active {
            color: #ffffff;
        }

        /* Tomchisimon harakatlanuvchi fon */
        .switcher-bg {
            position: absolute;
            top: 5px;
            left: 5px;
            width: calc(50% - 5px);
            height: calc(100% - 10px);
            background: var(--accent-color);
            border-radius: 30px;
            z-index: 1;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        body.girl-theme .switcher-bg {
            transform: translateX(100%);
            background: #ff69b4;
        }

        /* Pushti yaproqlar animatsiyasi (Faqat kelin tarafda ishlaydi) */
        .petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
            display: none;
        }

        body.girl-theme .petals-container {
            display: block;
        }

        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite;
            opacity: 0.7;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Asosiy konteyner */
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 25px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            z-index: 10;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Musiqa pleyeri */
        .music-player-box {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-info i {
            color: var(--accent-color);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }

        .play-pause-btn {
            background: var(--accent-color);
            color: #ffffff;
            width: 36px;
            height: 36px;
            border: none;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 4px;
            border-top: 1px solid var(--border-color);
        }

        .volume-box i {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: var(--border-color);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .info-card i {
            font-size: 22px;
            color: var(--accent-color);
            width: 30px;
            text-align: center;
        }

        .info-content h3 {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .info-content p {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-color);
        }

        .card-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            margin-top: 20px;
        }

        .card-box h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .card-number {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .card-holder {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .rsvp-btn {
            display: block;
            width: 100%;
            background: var(--accent-color);
            color: #ffffff;
            text-align: center;
            padding: 15px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .rsvp-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- Yuqori Tomchisimon Switcher -->
    <div class="switcher-wrapper">
        <div class="switcher-bg"></div>
        <button class="switch-btn active" onclick="setTheme('boy')" id="boyBtn">
            <i class="fa-solid fa-mars"></i> Kuyov tarafi
        </button>
        <button class="switch-btn" onclick="setTheme('girl')" id="girlBtn">
            <i class="fa-solid fa-venus"></i> Kelin tarafi
        </button>
    </div>

    <!-- Pushti yaproqlar animatsiyasi uchun konteyner -->
    <div class="petals-container" id="petalsContainer"></div>

    <!-- Asosiy Taklifnoma Konteyneri -->
    <div class="container">
        
        <!-- Musiqa Pleyeri -->
        <div class="music-player-box">
            <div class="player-top">
                <div class="track-info">
                    <i class="fa-solid fa-music"></i>
                    <span id="track-name">Chubina East Duo</span>
                </div>
                <div class="player-controls">
                    <button class="control-btn" onclick="prevTrack()" title="Oldingi"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="control-btn play-pause-btn" onclick="togglePlay()" id="play-icon-btn"><i class="fa-solid fa-play" id="play-pause-icon"></i></button>
                    <button class="control-btn" onclick="nextTrack()" title="Keyingi"><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>
            <div class="volume-box">
                <i class="fa-solid fa-volume-low"></i>
                <input type="range" min="0" max="1" step="0.05" value="0.5" class="volume-slider" oninput="changeVolume(this.value)">
                <i class="fa-solid fa-volume-high"></i>
            </div>
        </div>

        <audio id="audio-element" loop>
            <source src="Chubina East Duo.m4a" type="audio/mp4">
        </audio>

        <div class="header-title">
            <h1 id="coupleNames">Fatxulla & Zeboxon</h1>
            <p>Sizni quvonchimizga sherik bo'lishga taklif etamiz</p>
        </div>

        <div class="info-card">
            <i class="fa-solid fa-calendar-days"></i>
            <div class="info-content">
                <h3>Sana va Vaqt</h3>
                <p>2026-yil 13-sentabr, 19:00</p>
            </div>
        </div>

        <div class="info-card">
            <i class="fa-solid fa-location-dot"></i>
            <div class="info-content">
                <h3>To'yxona</h3>
                <p>Bekobod tumani, "Orom" to'yxonasi</p>
            </div>
        </div>

        <div class="card-box">
            <h3>To'yona uchun karta</h3>
            <div class="card-number">5614 6821 1130 4913</div>
            <div class="card-holder">Fatxulla Xusanboyev</div>
        </div>

        <a href="https://t.me/xanimkulov" target="_blank" class="rsvp-btn">
            <i class="fa-regular fa-paper-plane"></i> Tashrifni Tasdiqlash
        </a>
    </div>

    <script>
        const playlist = [
            { src: "yoningdaman.m4a.m4a", name: " Yoningdaman Benom" }
        ];

        let currentIndex = 0;
        const audio = document.getElementById('audio-element');
        const trackNameEl = document.getElementById('track-name');
        const playPauseIcon = document.getElementById('play-pause-icon');

        audio.volume = 0.5;

        function loadTrack(index) {
            audio.src = playlist[index].src;
            trackNameEl.innerText = playlist[index].name;
            audio.load();
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playPauseIcon.className = "fa-solid fa-pause";
            } else {
                audio.pause();
                playPauseIcon.className = "fa-solid fa-play";
            }
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex);
            audio.play();
            playPauseIcon.className = "fa-solid fa-pause";
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex);
            audio.play();
            playPauseIcon.className = "fa-solid fa-pause";
        }

        function changeVolume(val) {
            audio.volume = val;
        }

        function setTheme(type) {
            const body = document.body;
            const boyBtn = document.getElementById('boyBtn');
            const girlBtn = document.getElementById('girlBtn');
            const coupleNames = document.getElementById('coupleNames');

            if (type === 'girl') {
                body.classList.add('girl-theme');
                girlBtn.classList.add('active');
                boyBtn.classList.remove('active');
                coupleNames.innerText = "Zeboxon & Fatxulla";
            } else {
                body.classList.remove('girl-theme');
                boyBtn.classList.add('active');
                girlBtn.classList.remove('active');
                coupleNames.innerText = "Fatxulla & Zeboxon";
            }
        }

        // Pushti yaproqchalar yaratish (Kelin tarafi uchun)
        function createPetals() {
            const container = document.getElementById('petalsContainer');
            for (let i = 0; i < 15; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.top = -Math.random() * 20 + 'vh';
                petal.style.width = (Math.random() * 10 + 10) + 'px';
                petal.style.height = (Math.random() * 15 + 15) + 'px';
                petal.style.animationDuration = (Math.random() * 4 + 3) + 's';
                petal.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(petal);
            }
        }

        createPetals();
    </script>
</body>
</html>
